<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Heartbeat Glow Filter -->
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.9" />
    </filter>

    <!-- Visualizer Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="hudShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .hud-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 1px; }
    .hud-title { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #38bdf8; }
    .hud-line { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #cbd5e1; }
    .hud-dim { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; }
    .hud-val-green { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #10b981; }
    .hud-val-amber { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #f59e0b; }
    .hud-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="936" height="256" rx="14" fill="url(#hudBg)" stroke="url(#hudBorder)" stroke-width="1.5" filter="url(#hudShadow)" />

  <!-- Background Radar Grid Lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="45" x2="940" y2="45" />
    <line x1="0" y1="90" x2="940" y2="90" />
    <line x1="0" y1="135" x2="940" y2="135" />
    <line x1="0" y1="180" x2="940" y2="180" />
    <line x1="0" y1="225" x2="940" y2="225" />
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="750" y1="0" x2="750" y2="260" />
  </g>

  <!-- Top Title Bar -->
  <g transform="translate(24, 18)">
    <circle cx="6" cy="7" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="11" class="hud-header">MISSION CONTROL: CLOUD &amp; SYSTEM TELEMETRY HUB</text>

    <g transform="translate(730, -4)">
      <rect width="160" height="22" rx="11" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#10b981" />
      <text x="24" y="15" fill="#10b981" class="hud-pill">ALL SYSTEMS NOMINAL</text>
    </g>
  </g>

  <line x1="24" y1="46" x2="916" y2="46" stroke="#1e293b" stroke-width="1.2" />

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: LIVE INFRASTRUCTURE HEARTBEAT & LOGS (560px width)  -->
  <!-- ================================================================= -->
  <g transform="translate(24, 60)">
    <!-- Heartbeat ECG Wave Monitor Header -->
    <text x="0" y="12" class="hud-title">⚡ REAL-TIME SYSTEM HEARTBEAT &amp; METRICS</text>

    <!-- ECG Animated Heartbeat Line -->
    <g transform="translate(0, 22)">
      <rect width="520" height="38" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
      <!-- Static Grid Line -->
      <line x1="0" y1="19" x2="520" y2="19" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

      <!-- Glowing Pulse Wave Path with Moving Dash -->
      <path d="M 0 19 L 140 19 L 155 4 L 168 34 L 180 10 L 192 24 L 202 19 L 360 19 L 375 4 L 388 34 L 400 10 L 412 24 L 422 19 L 520 19" 
            fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ecgGlow)" stroke-dasharray="520" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="520; 0" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Telemetry Log Stream -->
    <g transform="translate(0, 78)">
      <!-- Line 1: AWS Serverless -->
      <circle cx="5" cy="6" r="3" fill="#38bdf8" />
      <text x="16" y="10" class="hud-dim">[AWS-ap-south-1]</text>
      <text x="135" y="10" class="hud-line">API Gateway &amp; Lambda Serverless Fleet:</text>
      <text x="440" y="10" class="hud-val-green">ONLINE (0ms Idle)</text>

      <!-- Line 2: AI Token Streaming -->
      <circle cx="5" cy="28" r="3" fill="#10b981" />
      <text x="16" y="32" class="hud-dim">[LLM-INFERENCE]</text>
      <text x="135" y="32" class="hud-line">NeerajGPT Stream (OpenAI / Gemini API):</text>
      <text x="440" y="32" class="hud-val-green">&lt;120ms Latency</text>

      <!-- Line 3: Web Scraper Nodes -->
      <circle cx="5" cy="50" r="3" fill="#f59e0b" />
      <text x="16" y="54" class="hud-dim">[ETL-HARVESTER]</text>
      <text x="135" y="54" class="hud-line">Headless Selenium Scraper Workers:</text>
      <text x="440" y="54" class="hud-val-amber">STANDBY / READY</text>

      <!-- Line 4: Security & Zero-Trust -->
      <circle cx="5" cy="72" r="3" fill="#a855f7" />
      <text x="16" y="76" class="hud-dim">[IAM-GOVERNANCE]</text>
      <text x="135" y="76" class="hud-line">Zero-Trust Environment &amp; Secrets Hygiene:</text>
      <text x="440" y="76" class="hud-val-green">ENFORCED (100%)</text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="575" y1="52" x2="575" y2="245" stroke="#1e293b" stroke-width="1.5" />

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: DYNAMIC AUDIO EQUALIZER & DEV FLOW                  -->
  <!-- ================================================================= -->
  <g transform="translate(600, 60)">
    <!-- Header -->
    <text x="0" y="12" class="hud-title">🎧 DEV MODE • THROUGHPUT STREAM</text>

    <!-- Equalizer Visualizer Container -->
    <g transform="translate(0, 24)">
      <rect width="315" height="52" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1" />

      <!-- 16 Animated Equalizer Bars Dancing to Code & Beats -->
      <!-- Bar 1 -->
      <rect x="18" y="15" width="8" height="22" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="8;32;14;38;10;28;8" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="36;12;30;6;34;16;36" dur="1.2s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 2 -->
      <rect x="36" y="20" width="8" height="18" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="18;38;8;30;20;36;18" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="26;6;36;14;24;8;26" dur="1.4s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 3 -->
      <rect x="54" y="10" width="8" height="30" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="28;10;36;18;34;12;28" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="16;34;8;26;10;32;16" dur="1.1s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 4 -->
      <rect x="72" y="25" width="8" height="15" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="14;34;20;38;10;26;14" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="30;10;24;6;34;18;30" dur="1.3s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 5 -->
      <rect x="90" y="8" width="8" height="36" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="36;16;32;10;38;22;36" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;28;12;34;6;22;8" dur="1.5s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 6 -->
      <rect x="108" y="18" width="8" height="24" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="20;38;12;34;16;30;20" dur="1.25s" repeatCount="indefinite" />
        <animate attributeName="y" values="24;6;32;10;28;14;24" dur="1.25s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 7 -->
      <rect x="126" y="12" width="8" height="28" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="32;14;38;20;10;36;32" dur="1.35s" repeatCount="indefinite" />
        <animate attributeName="y" values="12;30;6;24;34;8;12" dur="1.35s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 8 -->
      <rect x="144" y="24" width="8" height="16" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="12;36;18;32;8;28;12" dur="1.15s" repeatCount="indefinite" />
        <animate attributeName="y" values="32;8;26;12;36;16;32" dur="1.15s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 9 -->
      <rect x="162" y="16" width="8" height="26" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="26;8;34;16;38;12;26" dur="1.45s" repeatCount="indefinite" />
        <animate attributeName="y" values="18;36;10;28;6;32;18" dur="1.45s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 10 -->
      <rect x="180" y="20" width="8" height="20" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="18;34;10;38;22;14;18" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="26;10;34;6;22;30;26" dur="1.3s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 11 -->
      <rect x="198" y="10" width="8" height="30" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="34;16;38;12;30;20;34" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="10;28;6;32;14;24;10" dur="1.2s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 12 -->
      <rect x="216" y="22" width="8" height="18" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="16;38;22;8;36;14;16" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="28;6;22;36;8;30;28" dur="1.4s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 13 -->
      <rect x="234" y="14" width="8" height="26" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="28;12;34;18;38;10;28" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="16;32;10;26;6;34;16" dur="1.1s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 14 -->
      <rect x="252" y="26" width="8" height="14" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="14;36;18;32;8;26;14" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="30;8;26;12;36;18;30" dur="1.3s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 15 -->
      <rect x="270" y="8" width="8" height="36" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="36;18;30;12;38;24;36" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;26;14;32;6;20;8" dur="1.5s" repeatCount="indefinite" />
      </rect>

      <!-- Bar 16 -->
      <rect x="288" y="18" width="8" height="22" rx="3" fill="url(#barGrad)">
        <animate attributeName="height" values="22;8;36;14;30;18;22" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="22;36;8;30;14;26;22" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Workstation & Vitals Details -->
    <g transform="translate(0, 92)">
      <text x="0" y="12" class="hud-line">💻 Workstation:</text>
      <text x="110" y="12" class="hud-dim">Windows 11 • WSL2 Ubuntu</text>

      <text x="0" y="32" class="hud-line">⚡ IDE &amp; Shell:</text>
      <text x="110" y="32" class="hud-dim">VS Code • PowerShell 7</text>

      <text x="0" y="52" class="hud-line">🌍 Timezone:</text>
      <text x="110" y="52" class="hud-dim">IST (UTC+5:30) • India 🇮🇳</text>

      <text x="0" y="72" class="hud-line">🚀 Current Focus:</text>
      <text x="110" y="72" class="hud-val-green">AI Agents &amp; Cloud Systems</text>
    </g>
  </g>
</svg>
