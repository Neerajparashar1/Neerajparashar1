<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Card 1: Cyan Glow (Client & Edge) -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Card 2: Amber Glow (Serverless Compute) -->
    <linearGradient id="amberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="amberPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15" />
    </linearGradient>

    <!-- Card 3: Emerald Glow (Applied AI & Automation) -->
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>

    <!-- Card 4: Purple Glow (Data & Observability) -->
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Card Fill Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131d31" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; font-style: italic; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .code-tag { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 600; }
    .metric-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
    .header-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="940" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid Lines -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="940" y2="50" />
    <line x1="0" y1="100" x2="940" y2="100" />
    <line x1="0" y1="150" x2="940" y2="150" />
    <line x1="0" y1="200" x2="940" y2="200" />
    <line x1="0" y1="250" x2="940" y2="250" />
    <line x1="0" y1="300" x2="940" y2="300" />
    <line x1="0" y1="350" x2="940" y2="350" />
    <line x1="0" y1="400" x2="940" y2="400" />
    <line x1="0" y1="450" x2="940" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
  </g>

  <!-- Central Flow Connector Nodes -->
  <g opacity="0.4" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="470" y1="25" x2="470" y2="475" />
    <line x1="25" y1="250" x2="915" y2="250" />
  </g>

  <!-- ================================================================= -->
  <!-- CARD 1: CLIENT & EDGE GATEWAY (Top-Left)                         -->
  <!-- ================================================================= -->
  <g transform="translate(25, 25)">
    <rect width="435" height="210" rx="12" fill="url(#cardBg)" stroke="url(#cyanBorder)" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Indicator -->
    <rect x="18" y="16" width="6" height="22" rx="3" fill="#38bdf8" />
    <text x="32" y="32" fill="#f8fafc" class="title">CLIENT &amp; EDGE GATEWAY</text>
    <rect x="305" y="16" width="112" height="22" rx="11" fill="url(#cyanPill)" stroke="#38bdf8" stroke-width="1" />
    <text x="361" y="31" fill="#38bdf8" class="metric-badge" text-anchor="middle">&lt; 100ms LATENCY</text>

    <text x="18" y="55" fill="#94a3b8" class="subtitle">Sub-second client rendering &amp; edge distribution</text>

    <!-- Bullet Points -->
    <circle cx="23" cy="80" r="3" fill="#38bdf8" />
    <text x="34" y="84" class="body-text">Responsive single-page web &amp; conversational chatbot interfaces</text>

    <circle cx="23" cy="104" r="3" fill="#38bdf8" />
    <text x="34" y="108" class="body-text">AWS CloudFront global CDN distribution &amp; Route 53 low-latency DNS</text>

    <circle cx="23" cy="128" r="3" fill="#38bdf8" />
    <text x="34" y="132" class="body-text">AWS API Gateway endpoint routing with rate limiting &amp; CORS hygiene</text>

    <!-- Stack Pills -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="16" fill="#38bdf8" class="code-tag" text-anchor="middle">Tailwind</text>

      <rect x="78" y="0" width="82" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="119" y="16" fill="#38bdf8" class="code-tag" text-anchor="middle">JavaScript</text>

      <rect x="168" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="220" y="16" fill="#38bdf8" class="code-tag" text-anchor="middle">API Gateway</text>

      <rect x="281" y="0" width="95" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="328" y="16" fill="#38bdf8" class="code-tag" text-anchor="middle">CloudFront</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 2: SERVERLESS & COMPUTE (Top-Right)                         -->
  <!-- ================================================================= -->
  <g transform="translate(480, 25)">
    <rect width="435" height="210" rx="12" fill="url(#cardBg)" stroke="url(#amberBorder)" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Indicator -->
    <rect x="18" y="16" width="6" height="22" rx="3" fill="#f59e0b" />
    <text x="32" y="32" fill="#f8fafc" class="title">SERVERLESS &amp; COMPUTE</text>
    <rect x="295" y="16" width="122" height="22" rx="11" fill="url(#amberPill)" stroke="#f59e0b" stroke-width="1" />
    <text x="356" y="31" fill="#f59e0b" class="metric-badge" text-anchor="middle">60%+ COST SAVINGS</text>

    <text x="18" y="55" fill="#94a3b8" class="subtitle">Event-driven execution &amp; dynamic lifecycle control</text>

    <!-- Bullet Points -->
    <circle cx="23" cy="80" r="3" fill="#f59e0b" />
    <text x="34" y="84" class="body-text">Lightweight AWS Lambda microservices in Python &amp; Node.js</text>

    <circle cx="23" cy="104" r="3" fill="#f59e0b" />
    <text x="34" y="108" class="body-text">Automated EC2 instance lifecycle orchestration via Boto3 SDK</text>

    <circle cx="23" cy="128" r="3" fill="#f59e0b" />
    <text x="34" y="132" class="body-text">Elastic auto-scaling on demand with zero baseline idle cost</text>

    <!-- Stack Pills -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="95" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="47" y="16" fill="#f59e0b" class="code-tag" text-anchor="middle">AWS Lambda</text>

      <rect x="103" y="0" width="95" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="150" y="16" fill="#f59e0b" class="code-tag" text-anchor="middle">Amazon EC2</text>

      <rect x="206" y="0" width="90" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="251" y="16" fill="#f59e0b" class="code-tag" text-anchor="middle">Python Boto3</text>

      <rect x="304" y="0" width="75" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="341" y="16" fill="#f59e0b" class="code-tag" text-anchor="middle">Node.js</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 3: APPLIED AI & AUTOMATION (Bottom-Left)                    -->
  <!-- ================================================================= -->
  <g transform="translate(25, 265)">
    <rect width="435" height="210" rx="12" fill="url(#cardBg)" stroke="url(#emeraldBorder)" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Indicator -->
    <rect x="18" y="16" width="6" height="22" rx="3" fill="#10b981" />
    <text x="32" y="32" fill="#f8fafc" class="title">APPLIED AI &amp; WEB AUTOMATION</text>
    <rect x="300" y="16" width="117" height="22" rx="11" fill="url(#emeraldPill)" stroke="#10b981" stroke-width="1" />
    <text x="358" y="31" fill="#10b981" class="metric-badge" text-anchor="middle">LLM &amp; HEADLESS</text>

    <text x="18" y="55" fill="#94a3b8" class="subtitle">Intelligent LLM reasoning &amp; industrial web scrapers</text>

    <!-- Bullet Points -->
    <circle cx="23" cy="80" r="3" fill="#10b981" />
    <text x="34" y="84" class="body-text">Real-time token streaming &amp; conversational prompt chains (OpenAI)</text>

    <circle cx="23" cy="104" r="3" fill="#10b981" />
    <text x="34" y="108" class="body-text">Headless Selenium &amp; BeautifulSoup with DOM mutation watchers</text>

    <circle cx="23" cy="128" r="3" fill="#10b981" />
    <text x="34" y="132" class="body-text">Automated ETL pipelines converting raw HTML to structured JSON/CSV</text>

    <!-- Stack Pills -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="42" y="16" fill="#10b981" class="code-tag" text-anchor="middle">OpenAI API</text>

      <rect x="93" y="0" width="75" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="130" y="16" fill="#10b981" class="code-tag" text-anchor="middle">Selenium</text>

      <rect x="176" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="228" y="16" fill="#10b981" class="code-tag" text-anchor="middle">BeautifulSoup</text>

      <rect x="289" y="0" width="85" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="331" y="16" fill="#10b981" class="code-tag" text-anchor="middle">ETL Engine</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CARD 4: DATA PERSISTENCE & SRE (Bottom-Right)                    -->
  <!-- ================================================================= -->
  <g transform="translate(480, 265)">
    <rect width="435" height="210" rx="12" fill="url(#cardBg)" stroke="url(#purpleBorder)" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Indicator -->
    <rect x="18" y="16" width="6" height="22" rx="3" fill="#a855f7" />
    <text x="32" y="32" fill="#f8fafc" class="title">STORAGE, DATA &amp; SRE</text>
    <rect x="295" y="16" width="122" height="22" rx="11" fill="url(#purplePill)" stroke="#a855f7" stroke-width="1" />
    <text x="356" y="31" fill="#a855f7" class="metric-badge" text-anchor="middle">99.9% RELIABILITY</text>

    <text x="18" y="55" fill="#94a3b8" class="subtitle">ACID persistence, object buckets &amp; zero-trust policies</text>

    <!-- Bullet Points -->
    <circle cx="23" cy="80" r="3" fill="#a855f7" />
    <text x="34" y="84" class="body-text">Amazon RDS MySQL relational models for institutional CMS workflows</text>

    <circle cx="23" cy="104" r="3" fill="#a855f7" />
    <text x="34" y="108" class="body-text">Amazon S3 bucket tiering for datasets, document storage &amp; assets</text>

    <circle cx="23" cy="128" r="3" fill="#a855f7" />
    <text x="34" y="132" class="body-text">CloudWatch structured telemetry, alarms &amp; least-privilege IAM security</text>

    <!-- Stack Pills -->
    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="42" y="16" fill="#a855f7" class="code-tag" text-anchor="middle">MySQL RDS</text>

      <rect x="93" y="0" width="90" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="138" y="16" fill="#a855f7" class="code-tag" text-anchor="middle">Amazon S3</text>

      <rect x="191" y="0" width="95" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="238" y="16" fill="#a855f7" class="code-tag" text-anchor="middle">CloudWatch</text>

      <rect x="294" y="0" width="80" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="334" y="16" fill="#a855f7" class="code-tag" text-anchor="middle">AWS IAM</text>
    </g>
  </g>
</svg>
