<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 80" width="100%" height="100%">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c14" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="33%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="66%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box with Gradient Border -->
  <rect x="2" y="2" width="936" height="76" rx="12" fill="url(#metricBg)" stroke="url(#metricBorder)" stroke-width="1.5" filter="url(#glow)" />

  <!-- Divider Lines -->
  <line x1="235" y1="16" x2="235" y2="64" stroke="#1e293b" stroke-width="1.5" />
  <line x1="470" y1="16" x2="470" y2="64" stroke="#1e293b" stroke-width="1.5" />
  <line x1="705" y1="16" x2="705" y2="64" stroke="#1e293b" stroke-width="1.5" />

  <!-- Metric 1: Cloud & Serverless -->
  <g transform="translate(30, 26)">
    <circle cx="16" cy="14" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="16" y="19" font-size="14" text-anchor="middle">☁️</text>
    <text x="40" y="12" fill="#f8fafc" class="metric-value">AWS Serverless</text>
    <text x="40" y="27" class="metric-label">LAMBDA • EC2 • BOTO3</text>
  </g>

  <!-- Metric 2: AI & LLMs -->
  <g transform="translate(265, 26)">
    <circle cx="16" cy="14" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="16" y="19" font-size="14" text-anchor="middle">🤖</text>
    <text x="40" y="12" fill="#f8fafc" class="metric-value">Applied AI Systems</text>
    <text x="40" y="27" class="metric-label">OPENAI • LLM AGENTS • CHAT</text>
  </g>

  <!-- Metric 3: Web Scraping & Automation -->
  <g transform="translate(500, 26)">
    <circle cx="16" cy="14" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="16" y="19" font-size="14" text-anchor="middle">⚡</text>
    <text x="40" y="12" fill="#f8fafc" class="metric-value">ETL &amp; Web Scraping</text>
    <text x="40" y="27" class="metric-label">SELENIUM • HEADLESS DOM</text>
  </g>

  <!-- Metric 4: Full-Stack Architecture -->
  <g transform="translate(735, 26)">
    <circle cx="16" cy="14" r="14" fill="#a855f7" fill-opacity="0.15" />
    <text x="16" y="19" font-size="14" text-anchor="middle">🏛️</text>
    <text x="40" y="12" fill="#f8fafc" class="metric-value">Full-Stack &amp; CMS</text>
    <text x="40" y="27" class="metric-label">NODE • PHP • REST • MYSQL</text>
  </g>
</svg>
